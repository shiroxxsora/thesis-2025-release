name: thesis-2025-env
channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10

  # Core scientific stack
  - numpy
  - scipy
  - pandas
  - cython
  - tqdm
  - pyyaml

  # Computer vision / imaging
  - opencv
  - pillow
  - matplotlib

  # Geo stack
  - gdal
  - rasterio
  - shapely
  - geopandas

  # Reports / exports
  - reportlab
  - openpyxl

  # PyTorch + CUDA (conda-variant)
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  # Detectron2 (conda build)
  - detectron2
